# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: render-rmarkdown
run-name: Rendering rmarkdown files
on: [workflow_dispatch]
permissions:
  contents: read

jobs:
  render-rmarkdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: '4.5'
          use-public-rspm: true
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcurl4-gnutls-dev libxml2-dev libssl-dev libgsl-dev libgit2-dev cmake
          sudo apt-get install libharfbuzz-dev libfribidi-dev libfreetype6-dev libfontconfig1-dev
      - name: Configure source builds
        run: |
          printf '%s\n' 'CXX11STD = -std=gnu++14' > /tmp/scmega-Makevars
          echo 'R_MAKEVARS_USER=/tmp/scmega-Makevars' >> "$GITHUB_ENV"
      - name: Install archived destiny dependency
        shell: Rscript {0}
        run: |
          install.packages("TTR")
          install.packages(
            "https://cran.r-project.org/src/contrib/Archive/smoother/smoother_1.3.tar.gz",
            repos = NULL,
            type = "source"
          )
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          needs: website
          packages: |
            deps::.
            github::GreenleafLab/chromVARmotifs@38bed559c1f4770b6c91c80bf3f8ea965da26076
            github::immunogenomics/presto@b5df6ee6097eb62522f2e557aa93ac21bab2d05f
            github::GreenleafLab/ArchR@eda96f593dc5b57c9f23fcc00419e6f74cf66e55
          cache: false
          upgrade: 'FALSE'
      - name: Install checked-out scMEGA
        run: R CMD INSTALL .
      - name: Render Rmarkdown files
        run: |
          pkgdown::build_site()
        shell: Rscript {0}
      - name: Upload rendered site for maintainer review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-site
          path: docs/
